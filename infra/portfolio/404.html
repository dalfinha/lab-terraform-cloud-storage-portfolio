  </footer>

  <!-- DYNAMIC CAT GIF FETCH SCRIPT -->
  <script>
    const GITHUB_USERNAME = 'dalfinha';

    document.addEventListener('DOMContentLoaded', () => {
      fetchCatGifFromReadme();
    });

    async function fetchCatGifFromReadme() {
      const branches = ['main', 'master'];
      let readmeText = '';
      let activeBranch = 'main';

      for (const branch of branches) {
        try {
          const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_USERNAME}/${branch}/README.md`);
          if (res.ok) {
            readmeText = await res.text();
            activeBranch = branch;
            break;
          }
        } catch (e) {
          console.warn(`Erro ao consultar branch ${branch}:`, e);
        }
      }

      if (!readmeText) return;

      const imgRegex = /!\[(.*?)\]\((.*?)\)|<img[^>]+src=["']([^"']+)["'][^>]*>/gi;
      let match;
      let foundGifUrl = null;

      while ((match = imgRegex.exec(readmeText)) !== null) {
        const src = match[2] || match[3];
        const alt = (match[1] || '').toLowerCase();
        if (!src) continue;

        const srcLower = src.toLowerCase();
        if (srcLower.endsWith('.gif') || srcLower.includes('cat') || srcLower.includes('gato') || alt.includes('cat') || alt.includes('gato')) {
          foundGifUrl = src;
          if (srcLower.includes('cat') || srcLower.includes('gato')) break;
        }
      }

      if (foundGifUrl) {
        let finalUrl = foundGifUrl;
        if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
          const cleanPath = finalUrl.replace(/^\.\//, '').replace(/^\//, '');
          finalUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_USERNAME}/${activeBranch}/${cleanPath}`;
        }
        const catImg = document.getElementById('cat-walking-gif');
        if (catImg) catImg.src = finalUrl;
      }
    }
  </script>

</body>
